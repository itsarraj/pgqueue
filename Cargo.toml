[package]
name = "pgqueue"
version = "0.1.0"
edition = "2021"
description = "A Postgres-backed job queue for Rust — Sidekiq/Oban, without needing Redis"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/pgqueue"
readme = "README.md"
keywords = ["postgres", "queue", "jobs", "sidekiq", "worker"]
categories = ["asynchronous", "database"]

[lib]
name = "pgqueue"
path = "src/lib.rs"

[[bin]]
name = "pgqueue"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
actix-web = "4"

[dev-dependencies]
